[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rules-doctor"
version = "0.1.0"
description = "Health-check your CLAUDE.md / AGENTS.md rule files: dead @imports, shadowed files, instruction bloat."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hao Li" }]
keywords = ["claude-code", "agents-md", "claude-md", "lint", "ai-coding", "prompt-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/rules-doctor"
Repository = "https://github.com/hahahahahahahahah6/rules-doctor"
Issues = "https://github.com/hahahahahahahahah6/rules-doctor/issues"

[project.scripts]
rules-doctor = "rules_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
